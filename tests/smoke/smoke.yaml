# yaml-language-server: $schema=https://raw.githubusercontent.com/sublimelsp/lsp_smoke_test/v1/smoke.schema.json
file: index.md
# The session name until the package is migrated to LspPlugin.
server: marksman
# Marksman only checks links to other documents in a workspace folder, which it recognizes by .marksman.toml
# (or a .git directory); otherwise it runs in single-file mode.
# The wiki link points to a document that doesn't exist.
expected_diagnostics:
  source: Marksman
  message: Link to non-existent document
